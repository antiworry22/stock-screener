# GitHub 연동 배포용: site 폴더를 그대로 배포 (빌드 없음)
[build]
  publish = "site"
  command = ""
  # 15분마다 갱신되는 공공기관 자료(public.json)·시장 뉴스(news.json)만 바뀐 커밋은 재배포하지 않음
  # (사이트가 GitHub에서 직접 최신 파일을 읽으므로 배포 없이도 실시간 반영 → Netlify 배포 횟수 절약)
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- . ':(exclude)site/data/public.json' ':(exclude)site/data/news.json'"
