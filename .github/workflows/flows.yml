name: flows
# 외국인·기관 수급 — 거래소 잠정치가 나오는 시각에 맞춰 장중 4번 + 장 마감 뒤 3번 (평일)
# Actions → flows → Run workflow 로 아무 때나 즉시 실행 가능
on:
  schedule:
    - cron: "35 0 * * 1-5"    # 09:35 KST (09:30 잠정)
    - cron: "5 2 * * 1-5"     # 11:05 KST (11:00 잠정)
    - cron: "25 4 * * 1-5"    # 13:25 KST (13:20 잠정)
    - cron: "35 5 * * 1-5"    # 14:35 KST (14:30 잠정)
    - cron: "50 6 * * 1-5"    # 15:50 KST (장 마감 잠정)
    - cron: "40 7 * * 1-5"    # 16:40 KST
    - cron: "20 9 * * 1-5"    # 18:20 KST (확정)
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: flows
  cancel-in-progress: false
jobs:
  flows:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install requests pandas lxml
      - name: 직전 결과 불러오기
        continue-on-error: true
        run: |
          mkdir -p liveflow
          git fetch -q --depth=1 origin live-flow && git --work-tree=liveflow checkout FETCH_HEAD -- . && echo "직전 결과 불러옴" || echo "직전 결과 없음(처음 실행)"
          ls -la liveflow || true
      - name: 외국인·기관 수급 수집
        timeout-minutes: 11
        run: python pipeline/flows.py
      - name: 결과 → 보관 칸(live-flow)에 덮어쓰기 (사이트가 바로 읽음 · 재배포 없음)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          publish() { BR="$1"; shift; T="$(mktemp -d)"
            for p in "$@"; do if [ -d "$p" ]; then cp -r "$p"/. "$T"/; elif [ -f "$p" ]; then cp "$p" "$T"/; fi; done
            ( cd "$T" && git init -q && git checkout -q -b "$BR" && git config user.name screener-bot && git config user.email screener-bot@users.noreply.github.com \
              && git add -A && git commit -q -m "$BR $(date -u +'%F %H:%M')" \
              && for i in 1 2 3; do git push -q -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "$BR:$BR" && break; sleep 5; done ) }
          publish live-flow liveflow
