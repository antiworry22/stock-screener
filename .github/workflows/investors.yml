name: investors
# 투자자별 흐름(외국인·연기금·기관합계·개인) — 종목별 최근 20거래일 + 시장 전체. 장중엔 잠정치, 18시 이후 확정
# 자동 실행은 사이트의 자동 실행 도우미(dispatch)가 정해진 시각에 요청합니다. Actions → investors → Run workflow 로 즉시 실행 가능
on:
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: investors
  cancel-in-progress: false
jobs:
  investors:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install requests pandas "pykrx>=1.2.9"
      - name: 지난 자료 불러오기
        continue-on-error: true
        run: |
          mkdir -p liveinv
          git fetch -q --depth=1 origin live-inv && git --work-tree=liveinv checkout FETCH_HEAD -- . && echo "지난 자료 불러옴" || echo "지난 자료 없음(처음 실행)"
      - name: 투자자별 순매수 수집
        timeout-minutes: 20
        env:
          KRX_ID: ${{ secrets.KRX_ID }}
          KRX_PW: ${{ secrets.KRX_PW }}
        run: python pipeline/investors.py
      - name: 결과 → 보관 칸(live-inv)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          publish() { BR="$1"; shift; T="$(mktemp -d)"
            for p in "$@"; do if [ -d "$p" ]; then cp -r "$p"/. "$T"/; elif [ -f "$p" ]; then cp "$p" "$T"/; fi; done
            ( cd "$T" && git init -q && git checkout -q -b "$BR" && git config user.name screener-bot && git config user.email screener-bot@users.noreply.github.com \
              && git add -A && git commit -q -m "$BR $(date -u +'%F %H:%M')" \
              && for i in 1 2 3; do git push -q -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "$BR:$BR" && break; sleep 5; done ) }
          publish live-inv liveinv
