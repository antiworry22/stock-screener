name: market-news
# 시장 뉴스만 따로 새로 모으기 (1~2분). Actions → market-news → Run workflow 로 아무 때나 실행 가능
on:
  schedule:
    # 12:10 KST 월~금 (점심 무렵 장중 뉴스)
    - cron: "10 3 * * 1-5"
    # 21:10 KST 일요일 (주말 해외 뉴스 → 월요일 장 준비)
    - cron: "10 12 * * 0"
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: data-commit
  cancel-in-progress: false
jobs:
  news:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install requests
      - name: 시장 뉴스 수집
        timeout-minutes: 10
        run: python pipeline/market_news.py
      - name: 결과 커밋 (Netlify 자동 재배포)
        run: |
          git config user.name "screener-bot"
          git config user.email "screener-bot@users.noreply.github.com"
          git add site/data/news.json
          git diff --cached --quiet || git commit -m "news: $(date -u +'%F %H:%M')"
          git pull --rebase -X theirs origin main || true
          git push
