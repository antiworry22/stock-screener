name: market-news
# 국내·해외 시장 뉴스 15분마다 수집 (사이트는 GitHub에서 바로 읽어 재배포 없이 반영)
# Actions → market-news → Run workflow 로 아무 때나 즉시 실행 가능
on:
  schedule:
    # 매일 06:05~22:50 KST, 15분 간격 (공공기관 수집과 겹치지 않게 5분 어긋나게)
    - cron: "5,20,35,50 21-23,0-13 * * *"
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: market-news
  cancel-in-progress: false
jobs:
  news:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install requests
      - name: 시장 뉴스 수집
        timeout-minutes: 8
        run: python pipeline/market_news.py
      - name: 결과 커밋
        run: |
          git config user.name "screener-bot"
          git config user.email "screener-bot@users.noreply.github.com"
          git add site/data/news.json
          git diff --cached --quiet && exit 0
          git commit -m "news: $(date -u +'%F %H:%M')"
          for i in 1 2 3; do
            git pull --rebase -X theirs origin main && git push && break
            sleep 5
          done
