name: daily-collect
on:
  schedule:
    # 06:40 KST 월~금 (미국장 마감 직후 · 전일 국내 장마감 데이터 포함)
    - cron: "40 21 * * 0-4"
    # 16:50 KST 월~금 (국내 장마감 직후 업데이트)
    - cron: "50 7 * * 1-5"
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: data-commit
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install -r pipeline/requirements.txt
      - name: 수집 실행
        timeout-minutes: 100
        continue-on-error: true
        env:
          KRX_ID: ${{ secrets.KRX_ID }}
          KRX_PW: ${{ secrets.KRX_PW }}
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
          KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
          KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
        run: python pipeline/collect.py
      - name: 시장 뉴스 수집 (국내·해외 → 영향 종목)
        timeout-minutes: 10
        continue-on-error: true
        run: python pipeline/market_news.py
      - name: 결과 커밋 (Netlify 자동 재배포)
        if: always()
        run: |
          git config user.name "screener-bot"
          git config user.email "screener-bot@users.noreply.github.com"
          git add site/data/latest.json site/data/news.json 2>/dev/null || git add site/data/latest.json
          git diff --cached --quiet || git commit -m "data: $(date -u +%F)"
          git pull --rebase -X theirs origin main || true
          git push
